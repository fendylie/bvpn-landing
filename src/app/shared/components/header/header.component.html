<header id="sb-main-header">
  <div class="left-nav">
    <a routerLink="/" class="logo-wrapper">
      <img class="logo" src="assets/images/logo.png" alt="Funnel Journey Logo">
    </a>

    <div class="menu-toggle" [ngClass]="{'open': menuToggle}" (click)="toggleMobileMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <div class="right-nav" [ngClass]="{'active': menuToggle}">
    <div class="nav">
      <div class="nav-item">
        <a routerLink="/" class="nav-link" [ngClass]="{'active': activePathUrl === '/'}" (click)="closeMenu()">Home</a>
      </div>
      <div class="nav-item"><div (click)="scrollTo('#get-started')" class="nav-link" [ngClass]="{'active': activePathUrl.includes('features')}" (click)="closeMenu()">Get Started</div></div>
      <div class="nav-item"><div (click)="scrollTo('#apps')" class="nav-link" [ngClass]="{'active': activePathUrl.includes('how-it-works')}" (click)="closeMenu()">Apps</div></div>
      <div class="nav-item">
        <a routerLink="/servers" class="nav-link" [ngClass]="{'active': activePathUrl.includes('servers')}" (click)="closeMenu()">Servers</a>
      </div>
      <div class="nav-item"><div (click)="scrollTo('#help')" class="nav-link" [ngClass]="{'active': activePathUrl.includes('pricing')}" (click)="closeMenu()">Help</div></div>
    </div>

    <div class="action-wrapper">
      <a routerLink="/login">
        <ui-button [label]="'Login'" />
      </a>
    </div>
  </div>
</header>

<div class="header-spacing"></div>
